<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TimeMaster — Timesheet</title>
<style>
  :root{
    --navy:#4F46E5; --navy-700:#4338CA; --navy-100:#E0E7FF;
    --burg:#7C3AED; --burg-tint:#EDE4FF; --burg-text:#6D28D9;
    --green:#059669; --green-tint:#D1FAE5; --green-border:#A7F3D0; --green-num:#047857;
    --ot:#EA580C; --ot-tint:#FFEDD5; --ot-text:#C2410C;
    --page:#F1F3FB; --card:#FFFFFF; --panel:#F3F4FB;
    --line:#E4E6F2; --line-strong:#CBD0E6;
    --ink:#1E2235; --ink-2:#5A6178; --ink-3:#9AA0B6;
    --field:#FBFBFF;
    --radius:10px; --radius-lg:14px;
    --shadow:0 1px 2px rgba(20,30,50,.06), 0 1px 3px rgba(20,30,50,.05);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font); color:var(--ink); background:var(--page);
    -webkit-text-size-adjust:100%; line-height:1.5;
    padding-bottom:40px;
  }
  .wrap{width:100%; max-width:900px; margin:0 auto; padding:10px;}

  /* Header */
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px 12px; padding:6px 4px 14px; flex-wrap:wrap;}
  .topbar > .btn{margin-left:auto;}
  .brand{display:flex; align-items:center; gap:9px; min-width:0; flex:1 1 260px;}
  .app-mark{display:block; width:46px; height:46px; flex:0 0 46px; object-fit:contain; border-radius:9px;}
  .brand-logo{display:block; width:clamp(215px,40vw,320px); max-width:100%; height:auto; object-fit:contain;}
  .btn{min-height:42px; font-family:inherit; font-size:14px; font-weight:500; border-radius:10px; border:1px solid var(--line-strong);
       background:var(--card); color:var(--ink); padding:9px 14px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:7px; line-height:1; white-space:nowrap;}
  .btn:hover{background:var(--panel);}
  .btn:disabled{cursor:not-allowed; opacity:.55;}
  .btn:disabled:hover{background:var(--navy); color:#fff;}
  .btn svg{width:16px;height:16px;}
  .btn-navy{background:var(--navy); color:#fff; border-color:var(--navy);}
  .btn-navy:hover{background:var(--navy-700); color:#fff;}
  .btn-burg{background:var(--burg); color:#fff; border-color:var(--burg);}
  .btn-burg:hover{background:var(--burg-text); color:#fff;}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--navy);}
  .btn-ghost:hover{background:var(--navy-100);}
  .btn-danger{color:var(--burg-text); border-color:var(--line-strong); background:var(--card);}
  .btn-danger:hover{background:var(--burg-tint); color:var(--burg-text);}

  /* Stat cards */
  .stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px; box-shadow:var(--shadow); display:flex; gap:11px; align-items:flex-start;}
  .stat .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
  .stat .ic svg{width:17px;height:17px;}
  .ic-today{background:var(--green-tint); color:var(--green);}
  .ic-hours{background:var(--navy-100); color:var(--navy);}
  .ic-ot{background:var(--ot-tint); color:var(--ot-text);}
  .stat .big{font-size:22px; font-weight:600; line-height:1.1; color:var(--ink);}
  .stat .lbl{font-size:12px; color:var(--ink-2); margin-top:2px;}
  .stat .sub{font-size:11px; color:var(--ink-3);}
  .stat.today-in .big{color:var(--green-num);}

  /* Employee / period panel */
  .empbar{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:14px; box-shadow:var(--shadow); margin-bottom:12px;}
  .empbar .row1{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .empname{font-size:18px; font-weight:600; color:var(--navy); background:var(--field); border:1px solid var(--line-strong); border-radius:8px; padding:9px 12px; font-family:inherit; width:100%; max-width:300px;}
  .empname::placeholder{color:var(--ink-3); font-weight:500;}
  .empname:hover{border-color:var(--navy);}
  .empname:focus{outline:2px solid var(--navy); border-color:var(--navy); background:#fff;}
  .company{font-size:12px; color:var(--ink-2); margin-top:6px;}
  .status-pill{font-size:12px; font-weight:500; padding:3px 10px; border-radius:999px; background:var(--panel); color:var(--ink-2); white-space:nowrap;}
  .status-pill.working{background:var(--green-tint); color:var(--green);}
  .period-nav{display:flex; align-items:center; gap:6px; margin-top:12px;}
  .period-nav .pill{flex:1; text-align:center; font-size:13px; font-weight:500; color:var(--navy); background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px;}
  .iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line-strong);background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
  .iconbtn:hover{background:var(--panel);}
  .iconbtn svg{width:16px;height:16px;color:var(--navy);}

  /* Action buttons */
  .actions{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;}
  .actions .btn{flex:1 1 auto;}

  /* Day cards */
  .day{min-width:0; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:12px; box-shadow:var(--shadow); margin-bottom:10px;}
  .day.is-today{border-color:var(--navy); box-shadow:0 0 0 1px var(--navy);}
  .day-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px 10px; margin-bottom:12px; flex-wrap:wrap;}
  .day-date{font-size:14px; font-weight:600; color:var(--navy); min-width:0; flex:1 1 auto;}
  .day-date .dow{color:var(--ink-2); font-weight:500; margin-left:6px;}
  .day-right{display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex:1 1 100%; min-width:0; margin-left:0;}
  .day-summary{display:flex; gap:12px; text-align:center;}
  .day-summary .s-num{font-size:18px; font-weight:600; line-height:1; color:var(--ink);}
  .day-summary .s-num.ot{color:var(--ot-text);}
  .day-summary .s-lbl{font-size:9px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.03em; margin-top:2px;}
  .today-tag{font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--navy); background:var(--navy-100); padding:2px 7px; border-radius:999px; margin-left:8px;}
  .saved{font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:5px;}
  .saved .dot{width:8px;height:8px;border-radius:50%;background:var(--line-strong);}
  .saved.ok{color:var(--green);} .saved.ok .dot{background:var(--green);}

  .times{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:12px;}
  .field{min-width:0; overflow:hidden;}
  .field label{display:block; font-size:11px; color:var(--ink-2); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=time]{-webkit-appearance:none; appearance:none; width:100%; max-width:100%; min-width:0; box-sizing:border-box; font-family:inherit; font-size:16px; color:var(--ink); background:var(--field); border:1px solid var(--line-strong); border-radius:9px; padding:11px 12px; height:46px;}
  .field input[type=time]:focus{outline:2px solid var(--navy); border-color:var(--navy);}
  .clock-area{margin-bottom:12px;}
  .btn.big{width:100%; justify-content:center; padding:13px; font-size:15px; margin-bottom:8px;}
  .btn.record-btn{width:100%; justify-content:center; color:var(--navy); border-color:var(--navy); background:var(--card);}
  .btn.record-btn:hover{background:var(--navy-100);}
  .btn-clockin{background:var(--green); color:#fff; border-color:var(--green);}
  .btn-clockin:hover{background:var(--green-num); color:#fff;}
  .stamp{font-size:15px; color:var(--ink-2); margin-bottom:8px;}
  .stamp b{color:var(--navy); font-weight:600;}
  .stamp.muted{color:var(--ink-3);}
  .linkbtn{background:none; border:none; color:var(--navy); font-size:13px; cursor:pointer; padding:4px 2px; font-family:inherit; text-decoration:underline;}
  .linkbtn:hover{color:var(--burg);}
  .adjust{margin-bottom:12px; padding:12px; background:var(--panel); border:1px solid var(--line); border-radius:9px;}
  .adjust[hidden]{display:none;}
  .adjust .times{margin-bottom:0;}
  .edited-note{font-size:11px; color:var(--ink-3); margin-top:8px;}
  .edited-chip{font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; color:var(--burg-text); background:var(--burg-tint); padding:2px 7px; border-radius:999px; margin-left:8px;}
  .adjust-inline{margin-top:10px;}
  .adjust-inline label{display:block; font-size:11px; color:var(--ot-text); font-weight:600; margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .adjust-inline input[type=time]{-webkit-appearance:none; appearance:none; width:100%; max-width:220px; min-width:0; box-sizing:border-box; font-family:inherit; font-size:16px; color:var(--ink); background:var(--field); border:1px solid var(--ot); border-radius:9px; padding:10px 12px; height:44px;}
  .adjust-inline input[type=time]:focus{outline:2px solid var(--ot); border-color:var(--ot);}
  .manual-entry{margin-top:10px;}
  .manual-entry > label{display:block; font-size:11px; color:var(--ink-2); font-weight:600; margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .completed-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .completed-btns{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100%;}
  .entry-row{display:flex; flex-direction:column; gap:0; min-width:0;}
  .tfields{display:grid; grid-template-columns:minmax(0,1fr); gap:0; min-width:0; width:100%;}
  .edit-mini{padding:6px 14px; font-size:13px; width:100%;}
  .edit-done{margin-top:10px; padding:9px 16px; font-size:14px;}
  .edit-label{font-size:11px; color:var(--ink-2); font-weight:600; margin:12px 0 8px; text-transform:uppercase; letter-spacing:.03em;}
  .edit-label.ot-label{color:var(--ot-text);}
  .tfield{margin-bottom:10px;}
  .tfield > label{display:block; font-size:11px; color:var(--ink-2); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .tcell{display:flex; align-items:center; gap:2px; background:var(--field); border:1px solid var(--line-strong); border-radius:9px; height:46px; padding:6px 12px; width:100%; max-width:none; box-sizing:border-box;}
  .tcell:focus-within{outline:2px solid var(--navy); border-color:var(--navy);}
  .tcell.invalid{border-color:#DC2626; box-shadow:0 0 0 1px #DC2626;}
  .tin{width:2.4ch; min-width:0; border:none; background:transparent; font-family:inherit; font-size:16px; color:var(--ink); text-align:center; padding:4px 0;}
  .tin:focus{outline:none;}
  .tap{border:none; background:transparent; font-family:inherit; font-size:16px; color:var(--ink); margin-left:auto; padding:4px 2px; cursor:pointer;}
  .tap:focus{outline:none;}
  .tcolon{font-weight:700; color:var(--ink-2); font-size:16px;}
  .edit-btns{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; width:100%; margin-top:2px;}
  .edit-btns .btn{width:100%; min-width:0;}
  .edit-btns .btn:only-child{grid-column:1/-1;}

  .metrics{display:flex; gap:16px; margin-bottom:12px;}
  .metric .m-num{font-size:19px; font-weight:600; color:var(--ink);}
  .metric .m-num.ot{color:var(--ot-text);}
  .metric .m-lbl{font-size:11px; color:var(--ink-2); text-transform:uppercase; letter-spacing:.03em;}

  .notes-wrap label{display:block; font-size:11px; color:var(--ink-2); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em; display:flex; align-items:center; gap:5px;}
  .notes-wrap label svg{width:13px;height:13px;}
  textarea.notes{width:100%; min-height:96px; resize:vertical; font-family:inherit; font-size:14px; line-height:1.6;
    color:var(--ink); background:var(--field); border:1px solid var(--line-strong); border-radius:9px; padding:11px 12px; overflow:hidden;}
  textarea.notes:focus{outline:2px solid var(--navy); border-color:var(--navy);}
  .card-save-row{display:flex; margin-top:10px;}
  .card-save-row .btn{width:100%;}

  /* Totals */
  .totals{background:var(--navy); color:#fff; border-radius:var(--radius-lg); padding:16px 18px; display:flex; gap:20px; flex-wrap:wrap; margin-top:4px;}
  .totals .t{}
  .totals .t .n{font-size:24px; font-weight:600; line-height:1;}
  .totals .t .n.ot{color:#FDBA74;}
  .totals .t .l{font-size:12px; color:#9FB0C7; margin-top:3px;}
  .foot{font-size:11px; color:var(--ink-3); text-align:center; margin-top:16px;}

  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--navy); color:#fff;
    font-size:14px; padding:11px 18px; border-radius:10px; box-shadow:0 6px 20px rgba(20,30,50,.25); opacity:0; pointer-events:none; transition:.25s; z-index:50;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .modal-overlay{position:fixed; inset:0; background:rgba(20,25,45,.55); display:none; align-items:center; justify-content:center; z-index:100; padding:14px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff; border-radius:14px; width:100%; max-width:640px; max-height:92vh; display:flex; flex-direction:column; overflow:hidden; box-shadow:0 12px 40px rgba(20,25,45,.35);}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0; font-size:15px; color:var(--navy); font-weight:600;}
  .modal-body{flex:1; min-height:0; background:var(--panel);}
  .modal-body iframe{width:100%; height:56vh; border:none; background:#fff; display:block;}
  .modal-note{font-size:11px; color:var(--ink-3); text-align:center; padding:8px 16px 0;}
  .modal-note a{color:var(--navy); font-weight:600;}
  .modal-foot{display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap;}
  .modal-foot .btn{flex:1 1 auto; justify-content:center;}

  @media (min-width:480px){
    .wrap{padding:14px;}
    .day{padding:14px;}
    .day-right{flex:0 0 auto; margin-left:auto; justify-content:flex-end;}
    .completed-row{flex-wrap:nowrap;}
    .completed-btns{display:flex; width:auto; flex:none;}
    .completed-btns .btn{width:auto;}
    .tfields{grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px;}
    .edit-btns{display:flex; width:auto; margin-top:2px;}
    .edit-btns .btn{width:auto; min-width:88px;}
    .edit-btns .btn:only-child{grid-column:auto;}
    .card-save-row{justify-content:flex-end;}
    .card-save-row .btn{width:auto; min-width:150px;}
  }
  @media (min-width:700px){
    .stats{grid-template-columns:repeat(3,1fr);}
    .actions .btn{flex:0 1 auto;}
  }
  @media (min-width:820px){
    .entry-row{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:12px;}
    .entry-row .tfields{gap:12px;}
    .entry-row .tfield{margin-bottom:0;}
    .entry-row .edit-btns{align-self:end; margin:0;}
    .entry-row .edit-btns .btn{height:46px;}
  }
  @media print{ body{background:#fff;} .no-print{display:none!important;} }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* ---------- state ---------- */
const OT_THRESHOLD = 10;
const COMPANY = "Supremacy Services";
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let viewYear, viewMonth, viewHalf; // half: 0 = 1–15, 1 = 16–end
let data = load();
const editing = new Set();          // completed-day keys currently reopened for editing
const recording = new Set();        // empty past-day cards expanded for manual entry
const editSnapshot = {};            // pre-edit copies, for Cancel

/* ---------- storage ---------- */
function load(){ try{ return JSON.parse(localStorage.getItem("payrollgo_v1")) || {name:"", days:{}}; }catch(e){ return {name:"", days:{}}; } }
function save(){ localStorage.setItem("payrollgo_v1", JSON.stringify(data)); }

/* ---------- date helpers ---------- */
function pad(n){ return String(n).padStart(2,"0"); }
function keyFor(y,m,d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function lastDay(y,m){ return new Date(y,m+1,0).getDate(); }
function monthName(m){ return ["January","February","March","April","May","June","July","August","September","October","November","December"][m]; }

function periodDays(){
  const start = viewHalf===0 ? 1 : 16;
  const end   = viewHalf===0 ? 15 : lastDay(viewYear,viewMonth);
  const arr=[];
  for(let d=start; d<=end; d++) arr.push(d);
  return arr;
}
function periodLabelText(){
  const start = viewHalf===0 ? 1 : 16;
  const end   = viewHalf===0 ? 15 : lastDay(viewYear,viewMonth);
  return `${monthName(viewMonth)} ${start} – ${end}, ${viewYear}`;
}
function setToCurrentPeriod(){
  const now=new Date();
  viewYear=now.getFullYear(); viewMonth=now.getMonth();
  viewHalf = now.getDate()<=15 ? 0 : 1;
}
function shiftPeriod(dir){
  viewHalf += dir;
  if(viewHalf>1){ viewHalf=0; viewMonth++; if(viewMonth>11){viewMonth=0; viewYear++;} }
  if(viewHalf<0){ viewHalf=1; viewMonth--; if(viewMonth<0){viewMonth=11; viewYear--;} }
  render();
}

/* ---------- calc ---------- */
function calcHours(inV, outV){
  if(!inV || !outV) return 0;
  const [ih,im]=inV.split(":").map(Number);
  const [oh,om]=outV.split(":").map(Number);
  let mins = (oh*60+om) - (ih*60+im);
  if(mins<0) mins += 24*60;      // crossed midnight
  return mins/60;
}
function fmt(n){
  const totalMinutes=Math.round((Number(n)||0)*60);
  const hours=Math.floor(totalMinutes/60);
  const minutes=totalMinutes%60;
  if(minutes===0) return `${hours}h`;
  if(hours===0) return `${minutes}m`;
  return `${hours}h ${minutes}m`;
}

/* ---------- time field: one cell (hour : minute typed, AM/PM dropdown) ---------- */
function timeFieldHTML(key, field, label){
  const rec=data.days[key]||{};
  const val=(field==="in"?rec.in:rec.out)||"";
  let h="", m="", ap="AM";
  if(val){ const [H,M]=val.split(":").map(Number); ap=H>=12?"PM":"AM"; h=H%12||12; m=pad(M); }
  return `<div class="tfield">
    <label>${label}</label>
    <div class="tcell">
      <input class="tin" type="text" inputmode="numeric" maxlength="2" placeholder="--" value="${h}" data-k="${key}" data-f="${field}" data-p="h" aria-label="${label} hour">
      <span class="tcolon">:</span>
      <input class="tin" type="text" inputmode="numeric" maxlength="2" placeholder="--" value="${m}" data-k="${key}" data-f="${field}" data-p="m" aria-label="${label} minute">
      <select class="tap" data-k="${key}" data-f="${field}" data-p="ap" aria-label="${label} AM or PM">
        <option${ap==="AM"?" selected":""}>AM</option>
        <option${ap==="PM"?" selected":""}>PM</option>
      </select>
    </div>
  </div>`;
}

/* ---------- day time section (live clock + dropdown entry) ---------- */
function timeSectionHTML(rec,key,isToday){
  const hasIn=!!rec.in, hasOut=!!rec.out;

  // Completed day → locked, with Edit + Clear. Edit reopens fields with Done + Cancel.
  if(hasIn && hasOut){
    if(editing.has(key)){
      return `<div class="clock-area">
        <div class="edit-label">Edit times — will be marked “Edited”</div>
        <div class="entry-row">
          <div class="tfields">
            ${timeFieldHTML(key,"in","Time in")}
            ${timeFieldHTML(key,"out","Time out")}
          </div>
          <div class="edit-btns">
            <button class="btn" onclick="cancelEdit('${key}')">Cancel</button>
          </div>
        </div>
      </div>`;
    }
    return `<div class="clock-area"><div class="completed-row">
      <div class="stamp">In <b>${to12(rec.in)}</b> &nbsp;—&nbsp; Out <b>${to12(rec.out)}</b></div>
      <div class="completed-btns">
        <button class="btn edit-mini" onclick="editDay('${key}')">Edit</button>
        <button class="btn btn-danger edit-mini" onclick="clearDay('${key}')">Clear</button>
      </div>
    </div></div>`;
  }

  // Clocked in but no clock-out → live Clock out (today) + set-out dropdowns + Clear
  if(hasIn && !hasOut){
    let h=`<div class="stamp">Clocked in <b>${to12(rec.in)}</b></div>`;
    if(isToday) h+=`<button class="btn btn-navy big" onclick="clockNow('${key}','out')">Clock out</button>`;
    h+=`<div class="edit-label ot-label">Set clock-out time (if missed)</div>
        ${timeFieldHTML(key,"out","Time out")}
        <div class="edit-btns"><button class="btn btn-danger" onclick="clearDay('${key}')">Clear day</button></div>`;
    return `<div class="clock-area">${h}</div>`;
  }

  // No clock-in yet
  const t0=new Date(); t0.setHours(0,0,0,0);
  const [yy,mm,dd]=key.split("-").map(Number);
  const isFuture=new Date(yy,mm-1,dd)>t0;
  if(isFuture) return `<div class="clock-area"><div class="stamp muted">No hours yet</div></div>`;
  if(!isToday && !recording.has(key)){
    return `<div class="clock-area"><button class="btn record-btn" onclick="startRecord('${key}')">Record Time</button></div>`;
  }

  // Today (missed clock-in) or a past missed day → live Clock in (today) + manual dropdowns
  let h="";
  if(isToday) h+=`<button class="btn btn-clockin big" onclick="clockNow('${key}','in')">Clock in</button>`;
  h+=`<div class="edit-label">${isToday?"Or enter manually if needed":"Add times manually if needed"}</div>
      <div class="entry-row">
        <div class="tfields">
          ${timeFieldHTML(key,"in","Time in")}
          ${timeFieldHTML(key,"out","Time out")}
        </div>
      </div>`;
  return `<div class="clock-area">${h}</div>`;
}
function startRecord(key){ recording.add(key); render(); }
function editDay(key){ editSnapshot[key]=JSON.stringify(data.days[key]||null); editing.add(key); render(); }
function doneEdit(key){ delete editSnapshot[key]; editing.delete(key); render(); }
function cancelEdit(key){
  const snap=editSnapshot[key];
  if(snap!==undefined){ const v=JSON.parse(snap); if(v===null) delete data.days[key]; else data.days[key]=v; delete editSnapshot[key]; save(); }
  editing.delete(key); render();
}
function clearDay(key){ if(!confirm("Please confirm we want to Delete the information for this specific day")) return; delete data.days[key]; delete editSnapshot[key]; editing.delete(key); recording.delete(key); save(); render(); toast("Day cleared"); }
function refreshSummaries(){
  let pH=0,pO=0,dw=0;
  periodDays().forEach(d=>{
    const key=keyFor(viewYear,viewMonth,d);
    const rec=data.days[key]||{in:"",out:""};
    const hrs=calcHours(rec.in,rec.out); const ot=Math.max(0,hrs-OT_THRESHOLD);
    if(hrs>0){pH+=hrs;pO+=ot;dw++;}
    const hEl=document.querySelector(`.s-num[data-h="${key}"]`);
    const oEl=document.querySelector(`.s-num[data-o="${key}"]`);
    if(hEl) hEl.textContent=fmt(hrs);
    if(oEl) oEl.textContent=fmt(ot);
  });
  document.getElementById("periodHours").textContent=fmt(pH);
  document.getElementById("periodOT").textContent=fmt(pO);
  document.getElementById("tHours").textContent=fmt(pH);
  document.getElementById("tOT").textContent=fmt(pO);
  document.getElementById("tDays").textContent=dw;
  const now=new Date();
  renderTodayStat(keyFor(now.getFullYear(),now.getMonth(),now.getDate()));
}
function markCardSaved(card, rec){
  if(!card) return;
  const sv=card.querySelector(".saved");
  if(sv){ sv.classList.add("ok"); sv.innerHTML='<span class="dot"></span>Saved'; }
  const btn=card.querySelector(".card-save-row .btn");
  if(btn){ btn.textContent="Saved"; btn.disabled=true; }
  if(rec.edited && !card.querySelector(".edited-chip")){
    const dd=card.querySelector(".day-date");
    if(dd) dd.insertAdjacentHTML("beforeend",'<span class="edited-chip">Edited</span>');
  }
}
function markCardUnsaved(card){
  if(!card) return;
  const sv=card.querySelector(".saved");
  if(sv){ sv.classList.remove("ok"); sv.innerHTML='<span class="dot"></span>Unsaved changes'; }
  const btn=card.querySelector(".card-save-row .btn");
  if(btn) btn.textContent="Save";
  updateCardValidity(card);
}
function updateCardValidity(card){
  if(!card) return true;
  const cells=[...card.querySelectorAll(".tcell")];
  const state={};
  let valid=true;
  cells.forEach(cell=>{
    const hRaw=cell.querySelector('[data-p="h"]').value.trim();
    const mRaw=cell.querySelector('[data-p="m"]').value.trim();
    const field=cell.querySelector('[data-p="h"]').dataset.f;
    const started=!!(hRaw||mRaw);
    const H=Number(hRaw), M=Number(mRaw);
    const complete=started && hRaw!=="" && mRaw!=="" && Number.isInteger(H) && Number.isInteger(M) && H>=1 && H<=12 && M>=0 && M<=59;
    state[field]={started,complete,cell};
    cell.classList.toggle("invalid",started&&!complete);
    if(started&&!complete) valid=false;
  });
  if(state.in && state.out && state.in.complete!==state.out.complete){
    valid=false;
    if(!state.in.complete) state.in.cell.classList.add("invalid");
    if(!state.out.complete) state.out.cell.classList.add("invalid");
  }
  if(card.dataset.requireTimes==="1" && state.in && state.out && (!state.in.complete || !state.out.complete)){
    valid=false;
  }
  const btn=card.querySelector(".card-save-row .btn");
  if(btn){
    btn.disabled=!valid;
    if(!valid) btn.textContent="Enter valid times";
    else if(!btn.textContent.includes("Saved")) btn.textContent="Save";
  }
  return valid;
}
function commitCardTimes(card,key){
  const rec=ensure(key);
  card.querySelectorAll(".tcell").forEach(cell=>{
    const hEl=cell.querySelector('[data-p="h"]'), mEl=cell.querySelector('[data-p="m"]');
    const field=hEl.dataset.f;
    const hRaw=hEl.value.trim(), mRaw=mEl.value.trim();
    if(!hRaw && !mRaw){ rec[field]=""; return; }
    const H=Number(hRaw), M=Number(mRaw);
    const ap=cell.querySelector('[data-p="ap"]').value;
    let H24=H%12; if(ap==="PM") H24+=12;
    rec[field]=`${pad(H24)}:${pad(M)}`;
    hEl.value=H; mEl.value=pad(M);
  });
}
function saveDayCard(key){
  const card=document.querySelector(`.day[data-key="${key}"]`);
  if(!updateCardValidity(card)){ toast("Please enter complete, valid times"); return; }
  const rec=ensure(key);
  commitCardTimes(card,key);
  const notes=card && card.querySelector("textarea.notes");
  if(notes) rec.notes=notes.value;
  rec.saved=true;
  delete editSnapshot[key];
  editing.delete(key);
  recording.delete(key);
  save();
  render();
  toast("Day saved");
}
function onTimeChange(e){
  const cell=e.target.closest(".tcell");
  const k=e.target.dataset.k, f=e.target.dataset.f;
  const hEl=cell.querySelector('[data-p="h"]'), mEl=cell.querySelector('[data-p="m"]');
  let H=parseInt(hEl.value,10), M=parseInt(mEl.value,10);
  const ap=cell.querySelector('[data-p="ap"]').value;
  const rec=ensure(k);
  if(isNaN(H) || isNaN(M) || hEl.value.trim()==="" || mEl.value.trim()==="" || H<1 || H>12 || M<0 || M>59){
    rec[f]="";
  } else {
    hEl.value=H; mEl.value=pad(M);              // tidy display
    let H24=H%12; if(ap==="PM") H24+=12;
    rec[f]=`${pad(H24)}:${pad(M)}`;
  }
  rec.saved=false; rec.edited=true;
  refreshSummaries();
  const card=e.target.closest(".day");
  markCardUnsaved(card);
}

/* ---------- render ---------- */
function render(){
  document.getElementById("periodLabel").textContent = periodLabelText();
  document.getElementById("empName").value = data.name || "";

  const now=new Date();
  const todayKey = keyFor(now.getFullYear(), now.getMonth(), now.getDate());
  const container=document.getElementById("days");
  container.innerHTML="";

  let periodHours=0, periodOT=0, daysWorked=0;

  periodDays().forEach(d=>{
    const key=keyFor(viewYear,viewMonth,d);
    const rec=data.days[key] || {in:"",out:"",notes:"",saved:false};
    const dow=DOW[new Date(viewYear,viewMonth,d).getDay()];
    const hours=calcHours(rec.in,rec.out);
    const ot=Math.max(0,hours-OT_THRESHOLD);
    if(hours>0){ periodHours+=hours; periodOT+=ot; daysWorked++; }
    const isToday=(key===todayKey);
    const dateOnly=new Date(viewYear,viewMonth,d); dateOnly.setHours(0,0,0,0);
    const todayOnly=new Date(); todayOnly.setHours(0,0,0,0);
    const isFuture=dateOnly>todayOnly;
    const isComplete=!!(rec.in&&rec.out);
    const isEditing=editing.has(key);
    const isRecording=recording.has(key);
    const showNotes=!isFuture && (isToday || !!rec.in || !!rec.out || isRecording);
    const showSave=!isFuture && (isEditing || isRecording || (!isComplete && (isToday || !!rec.in)));

    const el=document.createElement("div");
    el.className="day"+(isToday?" is-today":"");
    el.dataset.key=key;
    el.dataset.requireTimes=isRecording?"1":"0";
    el.innerHTML=`
      <div class="day-head">
        <div class="day-date">${pad(viewMonth+1)}/${pad(d)}/${viewYear} <span class="dow">${dow}</span> ${isToday?'<span class="today-tag">Today</span>':''} ${rec.edited?'<span class="edited-chip">Edited</span>':''}</div>
        <div class="day-right">
          <div class="day-summary">
            <div><div class="s-num" data-h="${key}">${fmt(hours)}</div><div class="s-lbl">Hrs</div></div>
            <div><div class="s-num ot" data-o="${key}">${fmt(ot)}</div><div class="s-lbl">OT</div></div>
          </div>
          <div class="saved ${rec.saved?'ok':''}"><span class="dot"></span>${rec.saved?'Saved':'Not saved'}</div>
        </div>
      </div>
      ${timeSectionHTML(rec,key,isToday)}
      ${showNotes?`<div class="notes-wrap">
        <label><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>Notes / job address</label>
        <textarea class="notes" data-k="${key}" data-f="notes" placeholder="Job address, work done, etc." ${isComplete&&!isEditing?'readonly':''}>${rec.notes||""}</textarea>
      </div>`:''}
      ${showSave?`<div class="card-save-row">
        <button class="btn btn-navy" onclick="saveDayCard('${key}')" ${rec.saved?'disabled':''}>${rec.saved?'Saved':'Save'}</button>
      </div>`:''}`;
    container.appendChild(el);
  });

  // listeners
  container.querySelectorAll(".tcell input, .tcell select").forEach(el=>{
    el.addEventListener("change", onTimeChange);
  });
  container.querySelectorAll(".tcell input").forEach(el=>{
    el.addEventListener("input", ()=>{
      const card=el.closest(".day");
      markCardUnsaved(card);
    });
  });
  container.querySelectorAll("textarea.notes").forEach(t=>{
    autosize(t);
    t.addEventListener("input", ()=>{
      autosize(t);
      const rec=ensure(t.dataset.k);
      rec.notes=t.value;
      rec.saved=false;
      markCardUnsaved(t.closest(".day"));
    });
  });

  // stat cards + totals
  document.getElementById("periodHours").textContent=fmt(periodHours);
  document.getElementById("periodOT").textContent=fmt(periodOT);
  document.getElementById("tHours").textContent=fmt(periodHours);
  document.getElementById("tOT").textContent=fmt(periodOT);
  document.getElementById("tDays").textContent=daysWorked;
  renderTodayStat(todayKey);
}

function renderTodayStat(todayKey){
  const rec=data.days[todayKey];
  const card=document.getElementById("statToday");
  const val=document.getElementById("todayVal");
  const lbl=document.getElementById("todayLbl");
  const pill=document.getElementById("statusPill");
  card.classList.remove("today-in");
  if(rec && rec.in && !rec.out){
    val.textContent=fmt(calcHours(rec.in, nowHM())); lbl.textContent="Clocked in";
    card.classList.add("today-in");
    pill.textContent="Working"; pill.className="status-pill working";
  } else if(rec && rec.in && rec.out){
    val.textContent=fmt(calcHours(rec.in,rec.out)); lbl.textContent="Clocked out today";
    pill.textContent="Clocked out"; pill.className="status-pill";
  } else {
    val.textContent="—"; lbl.textContent="Not started today";
    pill.textContent="Not started"; pill.className="status-pill";
  }
}
function nowHM(){ const n=new Date(); return `${pad(n.getHours())}:${pad(n.getMinutes())}`; }

function autosize(t){ t.style.height="auto"; t.style.height=Math.max(96,t.scrollHeight)+"px"; }

/* ---------- edits ---------- */
function ensure(key){ if(!data.days[key]) data.days[key]={in:"",out:"",notes:"",saved:false}; return data.days[key]; }
function onFieldChange(e){
  const k=e.target.dataset.k, f=e.target.dataset.f;
  const rec=ensure(k); rec[f]=e.target.value; rec.saved=true;
  if(f==="in"||f==="out") rec.edited=true;   // manual time entry → flag as edited
  save();
  render();
}
function clockNow(key,field){
  const rec=ensure(key); rec[field]=nowHM(); rec.saved=true; save();
  toast(field==="in"?"Clocked in":"Clocked out");
  render();
}
function copyPrevDay(){
  const days=periodDays();
  let copied=0;
  for(let i=1;i<days.length;i++){
    const cur=keyFor(viewYear,viewMonth,days[i]);
    const prev=keyFor(viewYear,viewMonth,days[i-1]);
    const p=data.days[prev];
    const c=data.days[cur];
    if(p && (p.in||p.out) && !(c && (c.in||c.out))){
      data.days[cur]={in:p.in,out:p.out,notes:c&&c.notes?c.notes:"",saved:true,edited:true}; copied++;
    }
  }
  save(); render();
  toast(copied?`Copied into ${copied} empty day(s)`:"No empty days to fill");
}
function saveAll(){
  periodDays().forEach(d=>{ const k=keyFor(viewYear,viewMonth,d); if(data.days[k]) data.days[k].saved=true; });
  save(); render(); toast("All days saved");
}
function clearPeriod(){
  if(!confirm("Clear all entries for "+periodLabelText()+"? This can't be undone.")) return;
  periodDays().forEach(d=>{ delete data.days[keyFor(viewYear,viewMonth,d)]; });
  save(); render(); toast("Period cleared");
}
document.getElementById("empName").addEventListener("change",e=>{
  data.name=e.target.value.trim(); save();
});
document.getElementById("empName").addEventListener("focus",e=>{ e.target.select(); });

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),1900);
}

/* ---------- PDF ---------- */
function to12(hm){ if(!hm) return ""; let [h,m]=hm.split(":").map(Number); const ap=h>=12?"PM":"AM"; h=h%12||12; return `${h}:${pad(m)} ${ap}`; }
function buildPDF(){
  const jsPDFctor = window.jspdf && window.jspdf.jsPDF;
  if(!jsPDFctor || !window.jspdf) return null;
  const doc=new jsPDFctor({unit:"pt",format:"letter"});
  const name=(data.name&&data.name!=="Employee Name")?data.name:"Employee";
  const W=doc.internal.pageSize.getWidth();
  const M=40;
  const stamp=new Date().toLocaleString();

  // top line
  doc.setFontSize(8); doc.setTextColor(120);
  doc.text(stamp, M, 30);
  doc.text("TimeMaster — Timesheet", W/2, 30, {align:"center"});

  // header
  let periodHours=0,periodOT=0,daysWorked=0,anyEdited=false;
  const rows=[];
  periodDays().forEach(d=>{
    const key=keyFor(viewYear,viewMonth,d);
    const rec=data.days[key]||{in:"",out:"",notes:""};
    const dow=DOW[new Date(viewYear,viewMonth,d).getDay()];
    const hrs=calcHours(rec.in,rec.out); const ot=Math.max(0,hrs-OT_THRESHOLD);
    if(hrs>0){periodHours+=hrs;periodOT+=ot;daysWorked++;}
    if(rec.edited && (rec.in||rec.out)) anyEdited=true;
    const io = (rec.in||rec.out) ? `${to12(rec.in)} - ${to12(rec.out)}${rec.edited?" *":""}` : "";
    rows.push([`${pad(viewMonth+1)}/${pad(d)}`, dow, io, hrs?fmt(hrs):"", hrs?fmt(ot):"", rec.notes||""]);
    if(hrs>0){
      rows.push([
        {content:"",employerSpace:true}, "", "", "", "", ""
      ]);
    }
  });

  doc.setTextColor(67,56,202); doc.setFont(undefined,"bold"); doc.setFontSize(16);
  doc.text(name, M, 62);
  doc.setFont(undefined,"normal"); doc.setFontSize(10); doc.setTextColor(109,40,217);
  doc.text(COMPANY, M, 78);

  doc.setTextColor(67,56,202); doc.setFontSize(9);
  doc.text("PAY PERIOD", W-M, 54, {align:"right"});
  doc.setFont(undefined,"bold"); doc.setFontSize(12);
  doc.text(periodLabelText(), W-M, 70, {align:"right"});
  doc.setFont(undefined,"normal"); doc.setFontSize(9); doc.setTextColor(90);
  doc.text(`Total ${fmt(periodHours)}  ·  OT ${fmt(periodOT)}  ·  ${daysWorked} days`, W-M, 84, {align:"right"});

  rows.push([{content:"TOTALS",colSpan:3,styles:{halign:"right",fontStyle:"bold"}}, {content:fmt(periodHours),styles:{fontStyle:"bold"}}, {content:fmt(periodOT),styles:{fontStyle:"bold",textColor:[194,65,12]}}, ""]);

  doc.autoTable({
    startY:98, margin:{left:M,right:M},
    head:[["DATE","DAY","TIME IN - OUT","HRS","OT","NOTES"]],
    body:rows,
    styles:{fontSize:8, cellPadding:3.5, lineColor:[210,215,222], lineWidth:.5, textColor:[30,39,53], valign:"middle"},
    headStyles:{fillColor:[67,56,202], textColor:255, fontStyle:"bold", halign:"left"},
    columnStyles:{0:{cellWidth:50},1:{cellWidth:34},2:{cellWidth:125,overflow:"hidden"},3:{cellWidth:50,halign:"center",overflow:"hidden"},4:{cellWidth:34,halign:"center",overflow:"hidden"},5:{cellWidth:"auto"}},
    didParseCell:function(h){
      const first=h.row.raw && h.row.raw[0];
      if(h.section!=="body") return;
      if(first && first.content==="TOTALS") h.cell.styles.fillColor=[236,239,243];
      else if(first && first.employerSpace){
        h.cell.styles.fillColor=[255,255,255];
        h.cell.styles.minCellHeight=12;
        h.cell.styles.cellPadding=2;
      } else if(h.row.index%2===0) h.cell.styles.fillColor=[248,250,252];
    }
  });

  // signatures
  let y=doc.lastAutoTable.finalY+46;
  const colW=(W-2*M-30)/2;
  doc.setDrawColor(150); doc.setLineWidth(.6);
  doc.line(M,y,M+colW,y); doc.line(M+colW+30,y,W-M,y);
  doc.setFontSize(8.5); doc.setTextColor(90);
  doc.text("Employee signature / date", M, y+13);
  doc.text("Supervisor signature / date", M+colW+30, y+13);
  doc.setFontSize(8); doc.setTextColor(140);
  doc.text(`Overtime calculated after 10 hours per day.  Printed ${new Date().toLocaleDateString()}.`, M, y+34);
  if(anyEdited){ doc.text("* Time entered or edited manually (not a live clock punch).", M, y+45); }

  return {doc, name};
}

let previewBlob=null, previewUrl=null, previewName="";

function openPreview(){
  const built=buildPDF();
  if(!built){
    // offline / library blocked → browser print (Save as PDF works from the dialog)
    toast("Opening print dialog…");
    window.print();
    return;
  }
  const {doc,name}=built;
  previewName=`Timesheet_${name.replace(/\s+/g,"")}_${periodLabelText().replace(/[^0-9A-Za-z]+/g,"-")}.pdf`;
  previewBlob=doc.output("blob");
  if(previewUrl) URL.revokeObjectURL(previewUrl);
  previewUrl=URL.createObjectURL(previewBlob);

  document.getElementById("pdfFrame").src=previewUrl;
  document.getElementById("openTabLink").href=previewUrl;

  // hide Share if this device can't share files
  const canShare=navigator.canShare && navigator.canShare({files:[new File([previewBlob],previewName,{type:"application/pdf"})]});
  document.getElementById("mdShare").style.display = canShare ? "" : "none";

  document.getElementById("pdfModal").classList.add("show");
}
function closePreview(){ document.getElementById("pdfModal").classList.remove("show"); }

async function previewShare(){
  if(!previewBlob) return;
  const file=new File([previewBlob],previewName,{type:"application/pdf"});
  try{ await navigator.share({files:[file], title:"Timesheet", text:previewName.replace(/\.pdf$/,"")}); }
  catch(e){ /* user cancelled or unsupported */ }
}
function previewDownload(){
  if(!previewUrl) return;
  const a=document.createElement("a"); a.href=previewUrl; a.download=previewName; a.click();
  toast("PDF downloaded");
}
function previewPrint(){
  const f=document.getElementById("pdfFrame");
  try{ f.contentWindow.focus(); f.contentWindow.print(); }
  catch(e){ window.open(previewUrl,"_blank"); }
}

/* ---------- init ---------- */
setToCurrentPeriod();
render();
</script>
